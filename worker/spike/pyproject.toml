[project]
name = "mydeutsch-spike"
version = "0.1.0"
description = "Spike de la Fase 2: OCR (RNF-03), dobles páginas (RF-38), guiones (RF-39) y lemas (RF-23)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pymupdf>=1.24",
    "spacy>=3.8,<3.9",
    "de-core-news-md @ https://github.com/explosion/spacy-models/releases/download/de_core_news_md-3.8.0/de_core_news_md-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# En Windows el volumen montado en Docker marca todo como ejecutable.
extend-select = ["E", "F", "I", "UP", "B"]
extend-ignore = ["EXE002"]
