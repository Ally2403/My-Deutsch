[project]
name = "mydeutsch-worker"
version = "0.1.0"
description = "Worker de procesamiento de libros (RF-12): PDF escaneado → páginas WebP + JSON de tokens"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.4",
    "pymupdf>=1.24",
    "spacy>=3.8,<3.9",
    "de-core-news-md @ https://github.com/explosion/spacy-models/releases/download/de_core_news_md-3.8.0/de_core_news_md-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: necesita Tesseract, spaCy o Argos reales"]

[tool.ruff]
line-length = 100
extend-exclude = ["spike", "tools", ".local"]

[tool.ruff.lint]
extend-select = ["E", "F", "I", "UP", "B"]
extend-ignore = ["EXE002"]
