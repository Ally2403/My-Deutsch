[project]
name = "mydeutsch-worker"
version = "0.1.0"
description = "Worker de procesamiento de libros (RF-12): PDF escaneado → páginas WebP + JSON de tokens"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.4",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "spacy>=3.8,<3.9",
    "de-core-news-md @ https://github.com/explosion/spacy-models/releases/download/de_core_news_md-3.8.0/de_core_news_md-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
# Traducción automática Opus-MT (ADR-007): ejecutar el worker real.
opus = ["ctranslate2>=4,<5", "sentencepiece>=0.2"]
# Solo para aprovisionar: convierte los pesos de PyTorch a CTranslate2 (una vez, queda en caché).
opus-convert = ["torch>=2.6", "transformers>=4.44", "sentencepiece>=0.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: necesita Tesseract, spaCy u Opus-MT reales"]

[tool.ruff]
line-length = 100
extend-exclude = ["spike", "tools", ".local"]

[tool.ruff.lint]
extend-select = ["E", "F", "I", "UP", "B"]
extend-ignore = ["EXE002"]
