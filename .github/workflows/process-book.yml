# RF-12 · ADR-002 y ADR-006: procesa un libro subido y lo publica en Supabase.
# Lo dispara la API de Vercel con workflow_dispatch (inputs.book_id) o a mano.
# El repositorio es público: no se imprime texto de los libros ni se suben artefactos.
name: process-book

on:
  repository_dispatch:
    types: [process-book]
  workflow_dispatch:
    inputs:
      book_id:
        description: "UUID del libro (books.id)"
        required: true

# Un grupo por libro: un doble clic en «Reintentar» no lo procesa dos veces y los libros de
# otras personas no se pierden en la cola.
concurrency:
  group: process-book-${{ github.event.client_payload.book_id || inputs.book_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: worker
    env:
      BOOK_ID: ${{ github.event.client_payload.book_id || inputs.book_id }}
    steps:
      - name: Validar book_id
        working-directory: .
        run: |
          if ! [[ "$BOOK_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "book_id inválido"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Instalar Tesseract (alemán)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Caché del léxico
        id: lexicon-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: worker/.local/lexicon.sqlite
          key: lexicon-${{ hashFiles('worker/lexicon/build.py') }}

      - name: Construir el léxico (ADR-003)
        if: steps.lexicon-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .local
          curl -fL -o .local/de.jsonl.gz https://kaikki.org/dictionary/German/kaikki.org-dictionary-German.jsonl.gz
          uv run python -m lexicon.build .local/de.jsonl.gz .local/lexicon.sqlite
          rm .local/de.jsonl.gz

      - name: Caché de los modelos de traducción (ya convertidos)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/mydeutsch-models
          key: opus-${{ hashFiles('worker/lexicon/opus.py') }}

      - name: Instalar dependencias
        run: uv sync --extra opus --extra opus-convert

      - name: Instalar los modelos Opus-MT (revisión y huellas SHA-256 fijadas, ADR-007)
        run: uv run --extra opus --extra opus-convert python -m lexicon.opus provision

      - name: Procesar y publicar
        env:
          # RNF-20 · ADR-009: la copia del workflow de `main` usa producción; la de `dev` usa la
          # base «My Deutsch Dev» (URL pública; la clave está en el secreto SUPABASE_SERVICE_ROLE_KEY_DEV).
          SUPABASE_URL: ${{ github.ref_name == 'main' && secrets.SUPABASE_URL || 'https://eaanrkngazophdobzvzx.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ github.ref_name == 'main' && secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
        run: uv run --extra opus python -m publish --book-id "$BOOK_ID" --lexicon .local/lexicon.sqlite
