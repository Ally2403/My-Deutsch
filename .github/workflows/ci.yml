# RNF-12 c1: typecheck, lint, Vitest (con cobertura), pytest y Playwright en cada push y PR.
# Las pruebas no usan secretos: el lector demo es sintético y Supabase se apunta a una dirección
# local inexistente (sin sesión no hay llamadas de red). No se imprime texto de libros.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Vitest con cobertura de la lógica de dominio (≥ 70 %, RNF-12 c2)
        run: >
          pnpm vitest run --coverage
          --coverage.include="lib/domain/**" --coverage.exclude="**/*.test.ts"
          --coverage.reporter=text-summary
          --coverage.thresholds.lines=70
      - name: Instalar navegadores de Playwright
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Playwright (Chromium 360/768/1280 y WebKit iPhone)
        timeout-minutes: 15
        run: pnpm e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-trazas
          path: test-results/
          retention-days: 7

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Instalar Tesseract (alemán)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync
      - run: uv run ruff check
      - name: pytest (sin las pruebas «slow», que necesitan Opus-MT y el léxico completo)
        run: uv run pytest -m "not slow" -q
